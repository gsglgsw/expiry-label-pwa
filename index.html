<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <!-- 🚨 核心優化：鎖死縮放，並宣告 viewport-fit=cover 支援瀏海螢幕 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>效期標籤自動化系統</title>

    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#1e293b">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="./assets/icon-192.png">
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* 🚨 核心優化：採用 100dvh (動態視窗高度)，無視手機網址列干擾 */
        body { user-select: none; overflow: hidden; height: 100dvh; }
        
        /* 隱藏橫向滾動條，但保留滾動功能 (適用於手機版導覽列) */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .scanner-trap { position: absolute; opacity: 0; pointer-events: none; }
        
        @media print {
            body * { visibility: hidden; }
            #print-container, #print-container * { visibility: visible; }
            #qr-print-container, #qr-print-container * { visibility: visible; }
            #print-container, #qr-print-container { position: absolute; left: 0; top: 0; width: 100%; }
            .print-hide-ui { display: none !important; }
            #print-only-category, #print-only-mfd { display: block !important; }
            .print-label-page {
                page-break-after: always;
                border: 1px solid #333333 !important;
                border-radius: 8px !important;
                padding: 3mm !important;
                box-sizing: border-box !important;
                margin-bottom: 20px;
                background: white !important;
            }
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
        }
    </style>
</head>

    <!-- (省略原本的登入畫面 #login-view 與總部特權 #super-admin-modal，為求簡潔請保留你原本的程式碼) -->
<body class="bg-gray-100 text-gray-800 flex flex-col font-sans">
    
       <!-- 🚨 完整還原：全局 Loading 遮罩 (包含正確的 fixed 與 hidden 屬性) -->
    <div id="global-loading-overlay" class="fixed inset-0 bg-black/60 z-[9999] hidden flex-col items-center justify-center opacity-0 transition-opacity duration-300">
        <svg class="animate-spin h-12 w-12 text-white mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <p id="global-loading-text" class="text-white text-xl font-bold tracking-widest">載入中...</p>
    </div>
    <!-- 🚨 請將這裡補回你遺失的登入畫面！ -->
    <div id="login-view" class="fixed inset-0 z-50 flex flex-col items-center justify-center min-h-screen bg-gray-100 transition-opacity duration-500">
        <!-- 裡面是你原本的數字鍵盤與登入 UI -->
        <div class="bg-white p-8 rounded-2xl shadow-xl w-[400px]">
            <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">門市系統登入</h2>
            <!-- ... 保留你原本的 Numpad ... -->
        </div>
    </div>

    <!-- 🚨 請將這裡補回你遺失的特權彈窗！ -->
    <div id="super-admin-modal" class="hidden fixed inset-0 z-[100] ...">
        <!-- ... 保留你原本的特權登入 UI ... -->
    </div>
    <!-- 🚨 架構優化：頂部狀態列，將系統設定與登出整合至此 -->
    <header class="bg-slate-800 text-white h-[60px] px-4 md:px-6 flex justify-between items-center shadow-md shrink-0 z-20 relative">
        <div class="text-lg md:text-xl font-bold tracking-wider truncate">
            🏷️ 標籤系統
        </div>
        <div class="flex items-center gap-2 md:gap-4">
            <div id="network-status" class="hidden md:flex items-center gap-2 px-3 py-1 rounded-full bg-slate-700 text-xs">
                <span class="w-3 h-3 rounded-full bg-green-400 animate-pulse"></span>
                <span>網路連線</span>
            </div>
            <button id="sync-btn" class="bg-blue-600 hover:bg-blue-500 text-white p-2 md:px-4 md:py-2 rounded-lg font-bold shadow-lg transition-all text-sm">
                🔄 <span class="hidden md:inline">同步</span>
            </button>
            <button id="btn-open-settings" class="bg-slate-700 hover:bg-slate-600 p-2 md:px-4 md:py-2 rounded-lg transition-all text-sm" title="系統設定">
                ⚙️
            </button>
            <button id="btn-logout" class="bg-red-900/80 hover:bg-red-800 text-red-100 p-2 md:px-4 md:py-2 rounded-lg transition-all text-sm border border-red-800" title="登出">
                🚪
            </button>
        </div>
    </header>

    <!-- 🚨 架構優化：主視覺區 (改為 Column 排列，以支援小螢幕頂部導覽列) -->
    <main class="flex-1 flex flex-col lg:flex-row overflow-hidden bg-gray-50 relative">
        
        <!-- 🚨 分類導覽列 (小螢幕：頂部橫向滑動 / 大螢幕：左側直向固定) -->
        <aside class="w-full lg:w-48 bg-slate-800 text-white flex-shrink-0 z-10 flex flex-col shadow-md lg:shadow-2xl">
            <div class="hidden lg:block p-4 text-center border-b border-slate-700 shrink-0">
                <span class="font-bold tracking-widest text-slate-300">商品分類</span>
            </div>
            <!-- ul 加上橫向滑動屬性 -->
            <ul id="category-menu" class="flex flex-row overflow-x-auto lg:flex-col lg:overflow-y-auto w-full hide-scrollbar snap-x">
                <!-- JS 注入分類 -->
            </ul>
        </aside>

        <!-- 中央：商品網格與搜尋 -->
        <section class="flex-1 flex flex-col relative bg-gray-100 min-w-0">
            <div class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-4 md:px-6 shrink-0 shadow-sm z-10">
                <h2 id="current-category-title" class="text-xl md:text-2xl font-black text-gray-700 tracking-wider truncate">全部商品</h2>
                <div class="relative flex-shrink-0 ml-4">
                    <input type="text" id="item-search-input" class="pl-10 pr-4 py-2 w-40 md:w-64 border-2 border-gray-300 rounded-xl focus:border-blue-500 focus:outline-none font-bold text-gray-700 bg-gray-50" placeholder="搜尋...">
                    <span class="absolute left-3 top-2.5 text-gray-400">🔍</span>
                </div>
            </div>

            <!-- 🚨 商品清單容器：依尺寸自適應列數 -->
            <div id="item-grid-container" class="flex-1 overflow-y-auto p-4 md:p-6 grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 xl:grid-cols-5 gap-3 md:gap-5 content-start">
                <div class="col-span-full text-center text-gray-400 text-xl font-bold mt-10">等待載入資料庫...</div>
            </div>
        </section>

        <!-- 遮罩層 -->
        <div id="drawer-backdrop" class="fixed inset-0 bg-slate-900/60 z-30 hidden lg:hidden backdrop-blur-sm transition-opacity duration-300 opacity-0"></div>

        <!-- 🚨 右側列印抽屜 (100dvh 高度保護，確保不會被手機工具列吃掉) -->
        <aside id="print-drawer" class="fixed inset-y-0 right-0 z-40 w-[90%] max-w-[400px] lg:w-[400px] bg-white border-l border-gray-200 shadow-2xl lg:shadow-none flex flex-col transform translate-x-full lg:translate-x-0 lg:static transition-transform duration-300 shrink-0 h-[100dvh] lg:h-auto pb-[env(safe-area-inset-bottom)]">
            
            <div class="lg:hidden flex justify-between items-center p-3 border-b border-gray-200 bg-slate-50 shrink-0">
                <h3 class="text-lg font-bold text-slate-800">🏷️ 標籤設定</h3>
                <button id="btn-close-drawer" class="w-10 h-10 rounded-full bg-slate-200 hover:bg-slate-300 text-slate-600 flex items-center justify-center font-black text-xl active:bg-slate-400 transition-colors">✕</button>
            </div>

            <div class="p-4 border-b border-gray-100 bg-slate-50 shrink-0">
                <label class="block text-gray-500 text-xs font-bold mb-1">🧑‍🍳 當班員工</label>
                <!-- 縮小輸入框佔比 -->
                <input type="text" id="employee-name" placeholder="請輸入姓名..." class="w-full text-xl font-black border-2 border-gray-300 rounded-xl p-2 focus:border-blue-500 focus:outline-none text-center bg-white shadow-inner">
            </div>

            <div class="flex-1 overflow-y-auto flex flex-col relative pb-32">
                <div id="preview-empty-state" class="absolute inset-0 flex flex-col items-center justify-center text-gray-300 bg-white z-10 transition-opacity">
                    <span class="text-5xl mb-4">👈</span>
                    <p class="text-xl font-bold text-gray-400">請選擇商品</p>
                </div>

                <div id="preview-active-state" class="opacity-0 pointer-events-none transition-opacity duration-300 flex-1 flex flex-col p-4">
                    
                    <!-- 🚨 核心優化：使用 flex 置中，並透過 scale-[0.85] 縮小預覽框體，避免小手機爆版 -->
                    <div class="w-full flex justify-center transform scale-[0.85] sm:scale-[0.9] lg:scale-100 origin-top">
                        <div class="border-2 border-slate-700 rounded-xl p-5 bg-white shadow-sm flex flex-col shrink-0" style="width: 350px; height: 280px;">
                            <div class="text-sm text-gray-600 font-bold mb-2">
                                員工：<span id="preview-emp-name"></span>
                            </div>

                            <div class="flex items-center text-sm font-bold text-gray-800 mb-4 justify-between">
                                <div id="mfd-date-trigger" class="cursor-pointer hover:text-blue-600 flex items-center bg-slate-50 px-2 py-1 rounded">
                                    <span id="preview-mfd-display"></span>
                                    <svg class="w-4 h-4 ml-1 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                                    <input type="date" id="preview-mfd-input" class="opacity-0 absolute w-0 h-0 border-0">
                                </div>

                                <div class="flex items-center gap-1 bg-slate-100 rounded-lg p-1 border border-slate-200">
                                    <button id="btn-mfd-hour-minus" class="w-8 h-8 rounded bg-white font-black text-slate-600 active:scale-95 transition-all">-</button>
                                    <div class="w-10 text-center font-black text-lg text-blue-700" id="preview-mfd-hour-display" data-hour="0">00</div>
                                    <button id="btn-mfd-hour-plus" class="w-8 h-8 rounded bg-white font-black text-slate-600 active:scale-95 transition-all">+</button>
                                </div>
                            </div>

                            <div class="flex justify-between items-center mb-2">
                                <div id="preview-item-name" class="text-3xl font-black text-gray-800 leading-tight truncate max-w-[70%]"></div>
                                <div id="preview-category-text" class="text-lg font-bold text-gray-600 whitespace-nowrap"></div>
                            </div>

                            <div class="mt-auto w-full text-center pb-2">
                                <div id="preview-exd-text" class="text-[1.7rem] font-black text-gray-800 leading-snug tracking-wide"></div>
                            </div>
                        </div>
                    </div>

                    <div class="mt-4">
                        <label class="text-xs font-bold text-gray-500 mb-1 block">🏷️ 用途設定</label>
                        <select id="preview-category-select" class="w-full text-lg font-bold text-blue-700 border-2 border-blue-200 rounded-xl p-2 bg-blue-50 cursor-pointer"></select>
                    </div>
                </div>
            </div>

            <!-- 底部列印操作區 -->
            <div class="absolute bottom-0 left-0 w-full bg-white border-t border-gray-200 p-3 pb-[calc(12px+env(safe-area-inset-bottom))] flex flex-col gap-3 shadow-[0_-10px_20px_rgba(0,0,0,0.05)] z-20">
                <div class="flex items-center justify-between bg-slate-50 p-2 rounded-xl border border-slate-100">
                    <span class="text-lg font-bold text-gray-700 ml-2">張數</span>
                    <div class="flex items-center gap-2">
                        <button id="btn-qty-minus" class="w-12 h-12 rounded-xl bg-white border-2 border-slate-200 text-slate-600 font-bold text-2xl active:bg-slate-200">-</button>
                        <input type="number" id="print-quantity" class="w-14 h-12 text-center text-2xl font-black text-gray-800 border-2 border-slate-200 rounded-xl bg-white" value="1" min="1" max="99">
                        <button id="btn-qty-plus" class="w-12 h-12 rounded-xl bg-white border-2 border-slate-200 text-slate-600 font-bold text-2xl active:bg-slate-200">+</button>
                    </div>
                </div>

                <button id="btn-print" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black text-2xl h-16 rounded-2xl shadow-lg active:scale-95 transition-all flex items-center justify-center gap-2">
                    🖨️ 列印標籤
                </button>
            </div>
        </aside>
    </main>

    <!-- (省略系統設定彈窗模組 #settings-modal) -->

    <script type="module" src="./src/app.js"></script>
    <div id="toast-container" class="fixed bottom-5 right-5 z-[9999] flex flex-col items-end gap-3 pointer-events-none"></div>
</body>
</html>
