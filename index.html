<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>效期標籤自動化系統</title>

    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#1e293b">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="標籤系統">
    <link rel="apple-touch-icon" href="./assets/icon-192.png">
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body { user-select: none; overflow: hidden; }
        .scanner-trap { position: absolute; opacity: 0; pointer-events: none; }
        @media print {
            body * { visibility: hidden; }
            #print-container, #print-container * { visibility: visible; }
            #qr-print-container, #qr-print-container * { visibility: visible; }
            #print-container, #qr-print-container { position: absolute; left: 0; top: 0; width: 100%; }
            .print-hide-ui { display: none !important; }
            #print-only-category, #print-only-mfd { display: block !important; }
            .print-label-page {
                page-break-after: always;
                border: 1px solid #333333 !important;
                border-radius: 8px !important;
                padding: 3mm !important;
                box-sizing: border-box !important;
                margin-bottom: 20px;
                background: white !important;
            }
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
        }
    </style>
</head>

<body class="bg-gray-100 text-gray-800 h-screen flex flex-col font-sans">
    <div id="global-loading-overlay" class="fixed inset-0 bg-black/60 z-[9999] hidden flex-col items-center justify-center opacity-0 transition-opacity duration-300">
        <svg class="animate-spin h-12 w-12 text-white mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <p id="global-loading-text" class="text-white text-xl font-bold tracking-widest">載入中...</p>
    </div>

    <div id="login-view" class="fixed inset-0 z-50 flex flex-col items-center justify-center min-h-screen bg-gray-100 transition-opacity duration-500">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-[400px]">
            <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">門市系統登入</h2>
            <div class="mb-6 bg-gray-50 border-2 border-gray-200 rounded-lg h-16 flex items-center justify-center text-4xl tracking-[0.5em] font-mono text-gray-700">
                <span id="pin-display"></span>
            </div>
            <p id="login-error-msg" class="text-red-500 text-center mb-4 min-h-[24px] font-semibold opacity-0 transition-opacity"></p>
            <div id="numpad-container" class="grid grid-cols-3 gap-4">
                <button class="numpad-btn bg-gray-100 hover:bg-gray-200 text-gray-800 text-2xl font-semibold py-4 rounded-xl transition-colors" data-val="1">1</button>
                <button class="numpad-btn bg-gray-100 hover:bg-gray-200 text-gray-800 text-2xl font-semibold py-4 rounded-xl transition-colors" data-val="2">2</button>
                <button class="numpad-btn bg-gray-100 hover:bg-gray-200 text-gray-800 text-2xl font-semibold py-4 rounded-xl transition-colors" data-val="3">3</button>
                <button class="numpad-btn bg-gray-100 hover:bg-gray-200 text-gray-800 text-2xl font-semibold py-4 rounded-xl transition-colors" data-val="4">4</button>
                <button class="numpad-btn bg-gray-100 hover:bg-gray-200 text-gray-800 text-2xl font-semibold py-4 rounded-xl transition-colors" data-val="5">5</button>
                <button class="numpad-btn bg-gray-100 hover:bg-gray-200 text-gray-800 text-2xl font-semibold py-4 rounded-xl transition-colors" data-val="6">6</button>
                <button class="numpad-btn bg-gray-100 hover:bg-gray-200 text-gray-800 text-2xl font-semibold py-4 rounded-xl transition-colors" data-val="7">7</button>
                <button class="numpad-btn bg-gray-100 hover:bg-gray-200 text-gray-800 text-2xl font-semibold py-4 rounded-xl transition-colors" data-val="8">8</button>
                <button class="numpad-btn bg-gray-100 hover:bg-gray-200 text-gray-800 text-2xl font-semibold py-4 rounded-xl transition-colors" data-val="9">9</button>
                <button class="numpad-btn bg-red-50 hover:bg-red-100 text-red-600 text-xl font-bold py-4 rounded-xl transition-colors" data-action="clear">清除</button>
                <button class="numpad-btn bg-gray-100 hover:bg-gray-200 text-gray-800 text-2xl font-semibold py-4 rounded-xl transition-colors" data-val="0">0</button>
                <button class="numpad-btn bg-blue-500 hover:bg-blue-600 text-white text-xl font-bold py-4 rounded-xl transition-colors shadow-md" data-action="submit">登入</button>
            </div>
        </div>
    </div>
    <header class="bg-slate-800 text-white h-16 px-6 flex justify-between items-center shadow-md shrink-0">
        <div class="text-xl font-bold tracking-wider">
            🏷️ 廚房效期標籤系統 <span class="text-sm text-slate-400 ml-2 font-normal">v1.0-MVP</span>
        </div>
        <div class="flex items-center gap-4">
            <div id="network-status" class="flex items-center gap-2 px-3 py-1 rounded-full bg-slate-700 text-sm">
                <span class="w-3 h-3 rounded-full bg-green-400 animate-pulse"></span>
                <span>網路已連線</span>
            </div>
            <button id="sync-btn" class="bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white px-6 py-2 rounded-lg font-bold shadow-lg transition-all">
                🔄 同步資料庫
            </button>
        </div>
    </header>

    <div id="super-admin-modal" class="hidden fixed inset-0 bg-slate-900/90 z-[100] flex justify-center items-center backdrop-blur-md transition-all duration-300 opacity-0">
        <div class="bg-white rounded-3xl shadow-2xl w-11/12 max-w-md p-8 transform scale-95 transition-transform duration-300" id="super-admin-card">
            <h2 class="text-3xl font-black text-blue-800 mb-2 flex items-center gap-3">👑 總部特權登入</h2>
            <p class="text-gray-500 font-bold mb-6">設備硬體驗證通過。請選擇您要操作的門市：</p>
            <select id="super-store-select" class="w-full text-2xl font-bold bg-blue-50 border-4 border-blue-200 rounded-xl p-4 text-blue-900 focus:outline-none focus:border-blue-500 transition-all mb-8 shadow-inner cursor-pointer"></select>
            <button id="btn-super-enter" class="w-full px-6 py-5 rounded-2xl font-black text-2xl text-white bg-blue-600 hover:bg-blue-500 active:bg-blue-700 transition-colors shadow-[0_10px_20px_rgba(37,99,235,0.3)] active:scale-95">
                進入系統 🚀
            </button>
        </div>
    </div>

    <main class="flex-1 flex overflow-hidden bg-gray-50">
        <aside class="w-48 bg-slate-800 text-white flex flex-col shadow-2xl z-20 shrink-0">
            <div class="p-4 text-center border-b border-slate-700 shrink-0">
                <span class="font-bold tracking-widest text-slate-300">商品分類</span>
            </div>
            <ul id="category-menu" class="flex-1 overflow-y-auto flex flex-col w-full">
                <li class="p-5 text-xl font-bold text-center border-b border-slate-700 bg-blue-600 cursor-pointer transition-colors">全部商品</li>
            </ul>
            <div class="mt-4 pt-4 border-t border-gray-700">
                <button id="btn-open-settings" class="w-full flex items-center justify-center gap-2 bg-gray-700 hover:bg-gray-600 text-gray-200 py-3 rounded-xl transition-colors font-bold text-lg active:scale-95">⚙️ 系統設定</button>
                <button id="btn-logout" class="w-full flex items-center justify-center gap-2 bg-red-900/50 hover:bg-red-800 text-red-200 py-3 rounded-xl transition-colors font-bold text-lg active:scale-95 mt-3 border border-red-800/50">🚪 切換門市 / 登出</button>
            </div>
        </aside>

        <section class="flex-1 flex flex-col relative bg-gray-100">
            <div class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-6 shrink-0">
                <h2 id="current-category-title" class="text-2xl font-black text-gray-700 tracking-wider">全部商品</h2>
                <div class="relative">
                    <input type="text" id="item-search-input" class="pl-10 pr-4 py-2 w-64 border-2 border-gray-300 rounded-xl focus:border-blue-500 focus:outline-none font-bold text-gray-700" placeholder="搜尋品名...">
                    <span class="absolute left-3 top-2.5 text-gray-400">🔍</span>
                </div>
            </div>
            <div id="item-grid-container" class="flex-1 overflow-y-auto p-6 grid grid-cols-2 xl:grid-cols-3 2xl:grid-cols-4 gap-6 content-start">
                <div class="col-span-full text-center text-gray-400 text-xl font-bold mt-10">等待載入資料庫...</div>
            </div>
        </section>

        <!-- 🚨 核心重構：新增半透明遮罩 (僅在小螢幕顯示) -->
        <div id="drawer-backdrop" class="fixed inset-0 bg-slate-900/60 z-30 hidden lg:hidden backdrop-blur-sm transition-opacity duration-300 opacity-0"></div>

        <!-- 🚨 核心重構：列印面板轉為 Off-Canvas 抽屜 (大螢幕時透過 lg:static 恢復三欄並排) -->
        <aside id="print-drawer" class="fixed inset-y-0 right-0 z-40 w-full md:w-96 lg:w-1/3 lg:min-w-[350px] bg-white border-l border-gray-200 shadow-[0_0_25px_rgba(0,0,0,0.1)] lg:shadow-none flex flex-col transform translate-x-full lg:translate-x-0 lg:static transition-transform duration-300 shrink-0">
            
            <!-- 手機/平板版專屬 Header 與實體關閉鍵 -->
            <div class="lg:hidden flex justify-between items-center p-4 border-b border-gray-200 bg-slate-50 shrink-0">
                <h3 class="text-xl font-bold text-slate-800">🏷️ 標籤列印設定</h3>
                <button id="btn-close-drawer" class="w-10 h-10 rounded-full bg-slate-200 hover:bg-slate-300 text-slate-600 flex items-center justify-center font-black text-xl active:bg-slate-400 transition-colors">✕</button>
            </div>

            <!-- 員工設定 -->
            <div class="p-6 border-b border-gray-100 bg-slate-50 shrink-0">
                <label class="block text-gray-500 text-sm font-bold mb-2">🧑‍🍳 當班員工設定</label>
                <input type="text" id="employee-name" placeholder="請輸入姓名..." class="w-full text-2xl font-black border-2 border-gray-300 rounded-xl p-3 focus:border-blue-500 focus:outline-none text-center bg-white shadow-inner">
            </div>

            <!-- 滾動內容區 (🚨 加上 pb-40 避免被底部的 Sticky Footer 擋住) -->
            <div class="flex-1 overflow-y-auto p-6 flex flex-col relative pb-40">
                <div id="preview-empty-state" class="absolute inset-0 flex flex-col items-center justify-center text-gray-300 bg-white z-10 transition-opacity">
                    <span class="text-7xl mb-6">👈</span>
                    <p class="text-2xl font-bold text-gray-400">請點選左方商品</p>
                </div>

                <div id="preview-active-state" class="opacity-0 pointer-events-none transition-opacity duration-300 flex-1 flex flex-col">
                    <div class="border-2 border-slate-700 rounded-xl p-5 bg-white mx-auto relative shadow-sm flex flex-col" style="width: 350px; height: 280px;">
                        <div class="text-sm text-gray-600 font-bold mb-2">
                            員工：<span id="preview-emp-name"></span>
                        </div>

                        <div class="flex items-center text-sm font-bold text-gray-800 mb-4 justify-between">
                            <div id="mfd-date-trigger" class="cursor-pointer hover:text-blue-600 flex items-center bg-slate-50 px-2 py-1 rounded">
                                <span id="preview-mfd-display"></span>
                                <svg class="w-4 h-4 ml-1 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path>
                                </svg>
                                <input type="date" id="preview-mfd-input" class="opacity-0 absolute w-0 h-0 border-0">
                            </div>

                            <div class="flex items-center gap-1 bg-slate-100 rounded-lg p-1 border border-slate-200">
                                <button id="btn-mfd-hour-minus" class="w-8 h-8 rounded bg-white font-black text-slate-600 shadow-sm active:bg-slate-200 active:scale-95 transition-all">-</button>
                                <div class="w-10 text-center font-black text-lg text-blue-700" id="preview-mfd-hour-display" data-hour="0">00</div>
                                <button id="btn-mfd-hour-plus" class="w-8 h-8 rounded bg-white font-black text-slate-600 shadow-sm active:bg-slate-200 active:scale-95 transition-all">+</button>
                            </div>
                        </div>

                        <div class="flex justify-between items-center mb-2">
                            <div id="preview-item-name" class="text-3xl font-black text-gray-800 leading-tight truncate max-w-[70%]"></div>
                            <div id="preview-category-text" class="text-lg font-bold text-gray-600 whitespace-nowrap"></div>
                        </div>

                        <div class="mt-auto w-full text-center pb-2">
                            <div id="preview-exd-text" class="text-[1.7rem] font-black text-gray-800 leading-snug tracking-wide"></div>
                        </div>
                    </div>
                </div>

                <div class="mt-6">
                    <label class="text-sm font-bold text-gray-500 flex items-center gap-2 mb-2">🏷️ 標籤用途設定</label>
                    <select id="preview-category-select" class="w-full text-xl font-bold text-blue-700 border-2 border-blue-200 rounded-xl p-3 focus:outline-none focus:border-blue-500 bg-blue-50 cursor-pointer appearance-none"></select>
                </div>
            </div>

            <!-- 🚨 Sticky Bottom Footer (固定在底部，巨大化按鈕與高辨識度 Stepper) -->
            <div class="absolute bottom-0 left-0 w-full bg-white border-t border-gray-200 p-4 flex flex-col gap-4 shadow-[0_-10px_20px_rgba(0,0,0,0.05)] z-20">
                <div class="flex items-center justify-between bg-slate-50 p-2 rounded-xl border border-slate-100">
                    <span class="text-xl font-bold text-gray-700 ml-2 tracking-wide">列印張數</span>
                    <div class="flex items-center gap-2">
                        <button id="btn-qty-minus" class="w-14 h-14 rounded-xl bg-white border-2 border-slate-200 text-slate-600 font-bold text-3xl active:bg-slate-200 hover:border-slate-300 transition-colors shadow-sm">-</button>
                        <input type="number" id="print-quantity" class="w-16 h-14 text-center text-3xl font-black text-gray-800 border-2 border-slate-200 rounded-xl focus:outline-none focus:border-blue-500 bg-white shadow-inner" value="1" min="1" max="99">
                        <button id="btn-qty-plus" class="w-14 h-14 rounded-xl bg-white border-2 border-slate-200 text-slate-600 font-bold text-3xl active:bg-slate-200 hover:border-slate-300 transition-colors shadow-sm">+</button>
                    </div>
                </div>

                <button id="btn-print" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black text-3xl h-20 rounded-2xl shadow-lg shadow-blue-200 active:scale-95 transition-all flex items-center justify-center gap-3">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path>
                    </svg>
                    列印標籤
                </button>
            </div>
        </aside>
    </main>

    <div id="settings-modal" class="hidden fixed inset-0 bg-black bg-opacity-60 z-50 flex justify-center items-center backdrop-blur-sm transition-opacity">
        <div class="bg-white rounded-2xl shadow-2xl w-11/12 max-w-md p-6 transform scale-100 transition-transform">
            <h2 class="text-2xl font-black text-gray-800 mb-4 flex items-center gap-2">⚙️ 標籤機設定</h2>
            <div class="mb-6">
                <label class="block text-gray-700 font-bold mb-2 text-sm">🖨️ 標籤機 IP 位址</label>
                <input type="text" id="printer-ip-input" readonly class="w-full text-xl font-bold border-2 border-gray-200 rounded-lg p-3 text-gray-500 bg-gray-100 cursor-not-allowed" placeholder="等待雲端同步...">
                <p class="text-xs text-blue-500 mt-2 font-bold">ℹ️ 此 IP 由總部雲端派發，員工無須手動設定。</p>
            </div>
            <div class="flex justify-end gap-3 mt-8">
                <button id="btn-close-settings" class="px-6 py-3 rounded-xl font-bold text-gray-600 bg-gray-200 hover:bg-gray-300 transition-colors active:scale-95">取消</button>
                <button id="btn-save-settings" class="px-6 py-3 rounded-xl font-bold text-white bg-blue-600 hover:bg-blue-700 transition-colors shadow-md active:scale-95">💾 儲存設定</button>
            </div>
        </div>
    </div>

    <script type="module" src="./src/app.js"></script>
    <div id="toast-container" class="fixed bottom-5 right-5 z-[9999] flex flex-col items-end gap-3 pointer-events-none"></div>
</body>

</html>
